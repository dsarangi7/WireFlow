        # ---- WireFlow (app server on 127.0.0.1:3005) ----
        # Paste inside the server { listen 3002; ... } block, BEFORE location / { ... }.
        location = /wireflow { return 301 /wireflow/; }

        location /wireflow/ {
            proxy_pass http://127.0.0.1:3005/;           # trailing / strips the /wireflow/ prefix
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /wireflow;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 200m;                   # rack DXF uploads are tens of MB
            proxy_request_buffering off;
        }
        # ---- end WireFlow ----
